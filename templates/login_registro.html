<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noUva | Log in or sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink: '#00224F', deep: '#001737', grape: '#7C4DFF', sun: '#FFD54A', paper: '#F5F6FB' },
        fontFamily: { display: ['"Bricolage Grotesque"', 'sans-serif'], body: ['"DM Sans"', 'sans-serif'] }
      } }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    h1, h2, .font-display { font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; }
    :focus-visible { outline: 3px solid #7C4DFF; outline-offset: 2px; }
    .form-container { display: none; }
    .form-container.active { display: block; animation: fade .25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tab-button { color: #00224F99; }
    .tab-button.active { background: #fff; color: #00224F; box-shadow: 0 1px 4px rgba(0,34,79,.15); }
    .field { background: #F5F6FB; border: 1.5px solid transparent; }
    .field:focus { background: #fff; border-color: #7C4DFF; outline: none; box-shadow: 0 0 0 4px rgba(124,77,255,.15); }
    .side-bg {
      background:
        radial-gradient(40rem 24rem at 90% 0%, rgba(124,77,255,.5), transparent 60%),
        radial-gradient(30rem 20rem at 0% 100%, rgba(255,213,74,.14), transparent 60%),
        #00224F;
    }
    @media (prefers-reduced-motion: reduce) { .form-container.active { animation: none; } }

    /* Floating study supplies */
    .floaters { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .float { position: absolute; color: #fff; opacity: .14; animation: drift 14s ease-in-out infinite; }
    .float:nth-of-type(even) { animation-name: sway; color: #FFD54A; opacity: .16; }
    @keyframes drift { 0%, 100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-24px) rotate(calc(var(--r) + 14deg)); } }
    @keyframes sway { 0%, 100% { transform: translateX(0) rotate(var(--r)); } 50% { transform: translateX(18px) translateY(-14px) rotate(calc(var(--r) - 12deg)); } }
    @media (prefers-reduced-motion: reduce) { .float { animation: none; transform: rotate(var(--r)); } }
  </style>
</head>
<body class="bg-white text-ink antialiased">

  <div class="min-h-screen grid md:grid-cols-2">

    <!-- Brand panel -->
    <aside class="side-bg text-white hidden md:flex flex-col justify-between p-12 lg:p-16 relative overflow-hidden">
    <div class="floaters" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
      <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13v-3M9 7h6"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19zM14 7l3 3"/></symbol>
      <symbol id="i-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12 8h4M12 12h4M3 7h2M3 12h2M3 17h2"/></symbol>
      <symbol id="i-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
    </defs></svg>
      <svg class="float" style="top:6%;left:8%;width:62px;height:62px;--r:-12deg;animation-delay:0s;animation-duration:16s"><use href="#i-book"/></svg>
      <svg class="float" style="top:10%;right:8%;width:64px;height:64px;--r:-8deg;animation-delay:-2s;animation-duration:15s"><use href="#i-cap"/></svg>
      <svg class="float" style="top:34%;left:4%;width:52px;height:52px;--r:22deg;animation-delay:-5s;animation-duration:13s"><use href="#i-pencil"/></svg>
      <svg class="float" style="top:38%;right:5%;width:54px;height:54px;--r:10deg;animation-delay:-7s;animation-duration:18s"><use href="#i-notebook"/></svg>
      <svg class="float" style="top:62%;right:12%;width:46px;height:46px;--r:12deg;animation-delay:-3s;animation-duration:17s"><use href="#i-bulb"/></svg>
      <svg class="float" style="top:78%;left:10%;width:58px;height:58px;--r:16deg;animation-delay:-6s;animation-duration:14s"><use href="#i-book"/></svg>
      <svg class="float" style="top:88%;right:30%;width:50px;height:50px;--r:-20deg;animation-delay:-9s;animation-duration:12s"><use href="#i-pencil"/></svg>
    </div>
      <a href="/" class="relative z-10 text-sm font-bold text-white/80 hover:text-white transition-colors">&larr; Back to home</a>
      <div class="relative z-10">
        <img src="{{ url_for('static', filename='9482399-removebg-preview.png') }}" alt="Brain illustration" class="mx-auto max-h-80 w-auto drop-shadow-2xl">
        <h1 class="mt-10 text-4xl lg:text-5xl font-extrabold leading-[1.05] max-w-md">Your future starts with one account.</h1>
        <p class="mt-4 text-white/75 text-lg max-w-sm">Explore majors, take challenges and choose with confidence.</p>
      </div>
      <p class="relative z-10 text-sm text-white/50">&copy; 2025 noUva</p>
    </aside>

    <!-- Form panel -->
    <main class="flex flex-col justify-center px-6 py-10 sm:px-12 lg:px-20">
      <div class="w-full max-w-md mx-auto">
        <div class="flex items-center justify-between mb-10">
          <img src="{{ url_for('static', filename='logoFondoBlanco.jpeg') }}" alt="noUva logo" class="h-14 w-auto -ml-2">
          <a href="/" class="md:hidden text-sm font-bold text-ink/70 hover:text-grape">Home</a>
        </div>

        <div class="flex p-1 rounded-full bg-paper" role="tablist" aria-label="Account access">
          <button id="tab-login" role="tab" aria-selected="true" aria-controls="form-login" class="tab-button active flex-1 py-2.5 rounded-full font-bold transition-all duration-200">Login</button>
          <button id="tab-register" role="tab" aria-selected="false" aria-controls="form-register" class="tab-button flex-1 py-2.5 rounded-full font-bold transition-all duration-200">Sign up</button>
        </div>

        <div id="form-login" role="tabpanel" class="form-container active mt-10">
          <form id="login-form">
            <h2 class="text-3xl font-extrabold">Welcome back</h2>
            <p class="mt-2 text-ink/70">Log in to continue your challenges.</p>
            <div class="mt-8">
              <label for="login-correo" class="block text-sm font-bold mb-1.5">Email</label>
              <input type="email" id="login-correo" name="email" required autocomplete="email" class="field block w-full px-4 py-3.5 rounded-xl">
            </div>
            <div class="mt-5">
              <label for="login-password" class="block text-sm font-bold mb-1.5">Password</label>
              <input type="password" id="login-password" name="contrasena" required autocomplete="current-password" class="field block w-full px-4 py-3.5 rounded-xl">
            </div>
            <button type="submit" class="mt-8 w-full py-3.5 bg-ink text-white font-bold rounded-full hover:bg-grape transition-colors">Login</button>
          </form>
        </div>

        <div id="form-register" role="tabpanel" class="form-container mt-10">
          <form id="registro-form">
            <h2 class="text-3xl font-extrabold">Create your account</h2>
            <p class="mt-2 text-ink/70">It is free. Upgrade only if you want more.</p>
            <div class="mt-8">
              <label for="registro-nombre" class="block text-sm font-bold mb-1.5">Name</label>
              <input type="text" id="registro-nombre" name="nombre" required autocomplete="name" class="field block w-full px-4 py-3.5 rounded-xl">
            </div>
            <div class="mt-5">
              <label for="registro-correo" class="block text-sm font-bold mb-1.5">Email</label>
              <input type="email" id="registro-correo" name="email" required autocomplete="email" class="field block w-full px-4 py-3.5 rounded-xl">
            </div>
            <div class="mt-5">
              <label for="registro-password" class="block text-sm font-bold mb-1.5">Password</label>
              <input type="password" id="registro-password" name="contrasena" required autocomplete="new-password" class="field block w-full px-4 py-3.5 rounded-xl">
            </div>
            <button type="submit" class="mt-8 w-full py-3.5 bg-ink text-white font-bold rounded-full hover:bg-grape transition-colors">Sign up</button>
          </form>
        </div>

        <div id="mensaje-box" role="status" aria-live="polite" class="mt-6 p-4 rounded-xl text-center font-medium hidden"></div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const loginForm = document.getElementById('login-form');
      const registroForm = document.getElementById('registro-form');
      const mensajeDiv = document.getElementById('mensaje-box');

      function showForm(formToShow, tabToActivate) {
        [formLogin, formRegister].forEach(f => f.classList.remove('active'));
        [tabLogin, tabRegister].forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        formToShow.classList.add('active');
        tabToActivate.classList.add('active');
        tabToActivate.setAttribute('aria-selected', 'true');
        mensajeDiv.className = 'hidden';
      }

      tabLogin.addEventListener('click', () => showForm(formLogin, tabLogin));
      tabRegister.addEventListener('click', () => showForm(formRegister, tabRegister));

      async function submitForm(form, url) {
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        mensajeDiv.textContent = 'Processing...';
        mensajeDiv.className = 'mt-6 p-4 rounded-xl text-center font-medium text-ink/70 bg-paper block';

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
          });

          const result = await response.json();

          if (response.ok) {
            mensajeDiv.textContent = result.message || 'Success!';
            mensajeDiv.className = 'mt-6 p-4 rounded-xl text-center font-medium text-green-800 bg-green-100 block';
            form.reset();
            if (result.redirect_url) {
              window.location.href = result.redirect_url;
            }
          } else {
            mensajeDiv.textContent = result.error || 'An error occurred.';
            mensajeDiv.className = 'mt-6 p-4 rounded-xl text-center font-medium text-red-800 bg-red-100 block';
          }
        } catch (error) {
          console.error('Error:', error);
          mensajeDiv.textContent = 'A network or server error occurred.';
          mensajeDiv.className = 'mt-6 p-4 rounded-xl text-center font-medium text-red-800 bg-red-100 block';
        }
      }

      registroForm.addEventListener('submit', (e) => {
        e.preventDefault();
        submitForm(registroForm, 'http://127.0.0.1:5000/users/register');
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        submitForm(loginForm, 'http://127.0.0.1:5000/users/login');
      });
    });
  </script>
</body>
</html>
